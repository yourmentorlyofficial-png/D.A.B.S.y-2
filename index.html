<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DABSy — Living AI Desk Companion</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#03050a">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="ambient-aura" id="ambientAura"></div>

  <div id="installCard" class="install-banner">
    <div>
      <strong>Install DABSy</strong>
      <p style="font-size: 0.7rem; opacity: 0.9;">Add to home screen for full experience.</p>
    </div>
    <button id="installBtn">Install</button>
  </div>

  <div class="stage">
    <div class="face-container" id="faceContainer" title="Tap to interact">
      <div class="face-features">
        <div class="eyes-row">
          <div class="eye" id="leftEye"></div>
          <div class="eye" id="rightEye"></div>
        </div>
        <div class="mouth-smile" id="mouthSmile"></div>
      </div>
      
      <div class="companion-dialogue-box">
        <div class="companion-status-text" id="companionStatus">DABSy Awakening...</div>
        <div class="companion-speech" id="companionSpeech">Initializing neural core...</div>
      </div>
    </div>

    <div class="presentation-panel" id="presentationPanel">
      <div class="panel-header">
        <span class="panel-title" id="panelTitle">Study Breakdown</span>
        <button class="panel-close-btn" id="panelCloseBtn">✕</button>
      </div>
      <div id="panelContentArea" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </div>

    <div class="floating-control-bar">
      <button class="action-pill primary" id="talkBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        <span id="talkBtnText">Talk to DABSy</span>
      </button>
      <button class="action-pill" id="modeToggleBtn" title="Switch Mode">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="15" x2="15.01" y1="9" y2="9"/><line x1="9" x2="9.01" y1="9" y2="9"/></svg>
        <span id="modeNameDisplay">Fun Mode</span>
      </button>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
