<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">
  <meta name="description" content="DABSy AI desk and study companion">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">

  <title>DABSy</title>

  <link rel="stylesheet" href="./styles.css">
</head>

<body>

  <main id="dabsy">

    <div id="face">

      <div id="glow"></div>

      <div id="eyes">

        <div class="eye" id="leftEye">
          <div class="iris"></div>
          <div class="pupil"></div>
          <div class="shine"></div>
        </div>

        <div class="eye" id="rightEye">
          <div class="iris"></div>
          <div class="pupil"></div>
          <div class="shine"></div>
        </div>

      </div>

      <div id="speechBox">

        <div id="status">DABSy</div>

        <div id="speech">
          Hello. I'm here.
        </div>

      </div>

      <div id="hint">
        tap to talk · double-tap for DABSy
      </div>

      <div id="heart">♥</div>

    </div>


    <!-- BUBBLE MENU -->

    <div id="menu">

      <button id="studyBubble" class="bubble">
        <span>📚</span>
        <small>Study</small>
      </button>

      <button id="settingsBubble" class="bubble">
        <span>⚙️</span>
        <small>Settings</small>
      </button>

      <button id="installBubble" class="bubble">
        <span>↓</span>
        <small>Install</small>
      </button>

      <button id="closeBubble" class="bubble close">
        ×
      </button>

    </div>


    <!-- SETTINGS -->

    <div id="settings" class="panel">

      <div class="sheet">

        <div class="sheetTop">

          <strong>DABSy</strong>

          <button id="closeSettings">
            ×
          </button>

        </div>

        <p>
          DABSy's AI connection runs through
          your private serverless backend.
        </p>

        <div class="info">
          🔐
          <div>
            <strong>Private AI</strong>
            <small>
              Your Gemini key is not stored in this app.
            </small>
          </div>
        </div>

        <button id="testAI" class="mainButton">
          Test AI connection
        </button>

        <div id="connectionStatus"></div>

      </div>

    </div>


    <!-- STUDY -->

    <div id="study" class="panel">

      <div class="sheet">

        <div class="sheetTop">

          <strong>Study Mode</strong>

          <button id="closeStudy">
            ×
          </button>

        </div>

        <p>
          DABSy will explain things step-by-step
          instead of just throwing an answer at you.
        </p>

        <div class="subjects">

          <button data-subject="Physics">
            ⚛️
            <span>Physics</span>
          </button>

          <button data-subject="Chemistry">
            🧪
            <span>Chemistry</span>
          </button>

          <button data-subject="Mathematics">
            📐
            <span>Maths</span>
          </button>

          <button data-subject="Biology">
            🧬
            <span>Biology</span>
          </button>

        </div>

        <button id="studyTalk" class="mainButton">
          🎙️ Ask DABSy
        </button>

      </div>

    </div>


    <!-- ANSWER -->

    <div id="answer">

      <div id="answerTop">

        <strong>DABSy</strong>

        <button id="closeAnswer">
          ×
        </button>

      </div>

      <div id="answerText"></div>

    </div>

  </main>

  <script src="./app.js" defer></script>

</body>
</html>
