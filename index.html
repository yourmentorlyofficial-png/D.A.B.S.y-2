<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DABSy</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="stage">
    <div class="face-container" id="faceContainer">
      <div class="eyes-row">
        <div class="eye" id="leftEye"><div class="eye-dot"></div></div>
        <div class="eye" id="rightEye"><div class="eye-dot"></div></div>
      </div>
      
      <div class="companion-dialogue-box">
        <div class="companion-status-text" id="companionStatus" title="Tap to configure API key">DABSy Online</div>
        <div class="companion-speech" id="companionSpeech" title="Tap to talk">Hello Swagat, how can I help you today?</div>
      </div>
    </div>

    <div class="presentation-panel" id="presentationPanel">
      <div class="panel-header">
        <span class="panel-title" id="panelTitle">Study Breakdown</span>
        <button class="panel-close-btn" id="panelCloseBtn">✕</button>
      </div>
      <div id="panelContentArea" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
