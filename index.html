<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>D.A.B.S.y</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:white;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

#app{
  position:fixed;
  inset:0;
  background:#000;
  overflow:hidden;
  touch-action:none;
}

/* subtle invisible atmosphere */
#glow{
  position:absolute;
  width:80vw;
  height:60vh;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(
    ellipse,
    rgba(0,220,255,.12),
    rgba(0,0,0,0) 70%
  );
  filter:blur(55px);
  pointer-events:none;
}

/* =========================
   DABSy FACE
========================= */

#face{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:transform .25s ease;
  pointer-events:none;
}

#eyes{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(60px,13vw,135px);
}

.eye{
  width:clamp(110px,24vw,245px);
  height:clamp(170px,38vw,390px);
  border-radius:42%;
  position:relative;

  background:#08e4f5;

  box-shadow:
    0 0 20px rgba(0,240,255,.9),
    0 0 55px rgba(0,220,255,.6),
    0 0 120px rgba(0,200,255,.3);

  transition:
    width .25s,
    height .25s,
    transform .25s,
    background .25s;

  animation:breathing 4s ease-in-out infinite;
}

.eye:nth-child(2){
  animation-delay:-1.7s;
}

.highlight{
  position:absolute;
  left:18%;
  top:12%;
  width:25%;
  height:20%;
  border-radius:50%;
  background:white;
  opacity:.9;
}

@keyframes breathing{
  0%,100%{transform:scaleY(1)}
  50%{transform:scaleY(.97)}
}

/* blink */
.blink .eye{
  height:10px;
  border-radius:50%;
}

/* looking */
.lookLeft .eye{
  transform:translateX(-18px);
}

.lookRight .eye{
  transform:translateX(18px);
}

/* listening */
.listening .eye{
  transform:scale(1.04);
  box-shadow:
    0 0 25px white,
    0 0 70px rgba(0,240,255,.8),
    0 0 150px rgba(0,220,255,.45);
}

/* thinking */
.thinking .eye{
  animation:thinking .65s ease-in-out infinite alternate;
}

@keyframes thinking{
  from{transform:translateY(-8px) scaleY(.96)}
  to{transform:translateY(8px) scaleY(1)}
}

/* speaking */
.speaking .eye{
  animation:speaking .4s ease-in-out infinite alternate;
}

@keyframes speaking{
  from{transform:scaleY(.98)}
  to{transform:scaleY(1.03)}
}

/* mouth */
#mouth{
  width:65px;
  height:30px;
  margin-top:25px;

  border-bottom:5px solid #08e4f5;
  border-radius:0 0 70px 70px;

  filter:drop-shadow(0 0 8px #08e4f5);
}

.speaking #mouth{
  width:48px;
  height:35px;
  border:4px solid #08e4f5;
  border-radius:50%;
  animation:talk .16s infinite alternate;
}

@keyframes talk{
  from{transform:scaleY(.5)}
  to{transform:scaleY(1)}
}

/* =========================
   TEXT
========================= */

#text{
  position:absolute;
  left:50%;
  top:calc(50% + 220px);
  transform:translateX(-50%);
  width:88%;
  text-align:center;
  pointer-events:none;
}

#status{
  font-size:12px;
  letter-spacing:.25em;
  color:rgba(255,255,255,.5);
  text-transform:uppercase;
  margin-bottom:12px;
}

#message{
  font-size:clamp(15px,4vw,22px);
  line-height:1.45;
  color:rgba(255,255,255,.92);
}

/* =========================
   DOUBLE TAP BUBBLES
========================= */

#menu{
  position:absolute;
  left:50%;
  top:50%;
  width:0;
  height:0;
}

.bubble{
  position:absolute;

  width:74px;
  height:74px;

  border-radius:50%;

  border:1px solid rgba(255,255,255,.12);

  background:rgba(15,15,18,.82);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  color:white;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  opacity:0;
  transform:scale(.2);

  pointer-events:none;

  transition:
    opacity .25s,
    transform .35s cubic-bezier(.2,.9,.2,1);
}

.bubble span{
  font-size:23px;
}

.bubble small{
  font-size:9px;
  color:rgba(255,255,255,.6);
}

#study{
  left:-120px;
  top:-55px;
}

#settings{
  left:46px;
  top:-55px;
}

.menuOpen .bubble{
  opacity:1;
  transform:scale(1);
  pointer-events:auto;
}

/* =========================
   STUDY BADGE
========================= */

#studyBadge{
  position:absolute;
  top:max(20px,env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);

  padding:9px 16px;

  border-radius:999px;

  background:rgba(20,20,20,.75);
  border:1px solid rgba(0,230,255,.2);

  color:rgba(255,255,255,.7);

  font-size:11px;
  letter-spacing:.12em;

  opacity:0;
  transition:.3s;
}

.studyMode #studyBadge{
  opacity:1;
}

/* =========================
   SETTINGS
========================= */

#settingsScreen{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:25px;

  background:rgba(0,0,0,.75);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  opacity:0;
  pointer-events:none;

  transition:.25s;

  z-index:50;
}

#settingsScreen.open{
  opacity:1;
  pointer-events:auto;
}

.card{
  width:min(90vw,430px);

  padding:28px;

  border-radius:28px;

  background:rgba(18,18,20,.9);

  border:1px solid rgba(255,255,255,.1);

  box-shadow:0 30px 100px rgba(0,0,0,.7);

  position:relative;
}

.card h1{
  font-size:25px;
}

.card p{
  margin-top:4px;
  margin-bottom:28px;
  color:rgba(255,255,255,.45);
}

.card label{
  display:block;
  font-size:12px;
  color:rgba(255,255,255,.6);
  margin-bottom:8px;
}

#apiKey{
  width:100%;
  height:48px;

  border-radius:14px;

  border:1px solid rgba(255,255,255,.1);

  background:rgba(255,255,255,.05);

  color:white;

  padding:0 14px;

  font-size:14px;

  outline:none;

  user-select:text;
}

#apiKey:focus{
  border-color:#08e4f5;
}

#connect{
  width:100%;
  height:48px;

  margin-top:12px;

  border:0;
  border-radius:14px;

  background:linear-gradient(135deg,#7864ff,#00dff5);

  color:white;

  font-weight:bold;
}

#close{
  position:absolute;
  right:18px;
  top:18px;

  width:38px;
  height:38px;

  border-radius:50%;

  border:1px solid rgba(255,255,255,.1);

  background:rgba(255,255,255,.05);

  color:white;

  font-size:22px;
}

#keyStatus{
  margin-top:12px;
  font-size:11px;
  color:rgba(255,255,255,.5);
}

/* =========================
   SHAKE
========================= */

.dizzy{
  animation:dizzy .12s linear infinite;
}

@keyframes dizzy{
  0%{transform:translate(-3px,-3px) rotate(-3deg)}
  25%{transform:translate(3px,-2px) rotate(3deg)}
  50%{transform:translate(-3px,3px) rotate(-3deg)}
  75%{transform:translate(3px,2px) rotate(3deg)}
  100%{transform:translate(0,0) rotate(0)}
}

/* error eyes */
.error .eye{
  background:#ff4165;
  box-shadow:
    0 0 20px rgba(255,50,80,.9),
    0 0 70px rgba(255,30,70,.5);
}

@media(max-width:600px){

  #eyes{
    gap:70px;
  }

  .eye{
    width:110px;
    height:175px;
  }

  #text{
    top:calc(50% + 185px);
  }
}
</style>
</head>

<body>

<div id="app">

  <div id="glow"></div>

  <div id="face">

    <div id="eyes">

      <div class="eye">
        <div class="highlight"></div>
      </div>

      <div class="eye">
        <div class="highlight"></div>
      </div>

    </div>

    <div id="mouth"></div>

  </div>


  <div id="text">

    <div id="status">
      DABSy
    </div>

    <div id="message">
      Hello Swagat. Tap me.
    </div>

  </div>


  <div id="menu">

    <button class="bubble" id="study">
      <span>📚</span>
      <small>Study</small>
    </button>

    <button class="bubble" id="settings">
      <span>⚙️</span>
      <small>Settings</small>
    </button>

  </div>


  <div id="studyBadge">
    📚 STUDY MODE
  </div>


  <div id="settingsScreen">

    <div class="card">

      <button id="close">
        ×
      </button>

      <h1>D.A.B.S.y</h1>

      <p>Gemini brain</p>

      <label>
        Gemini API key
      </label>

      <input
        id="apiKey"
        type="password"
        placeholder="Paste your Gemini API key"
        autocomplete="off"
      >

      <button id="connect">
        Connect Gemini
      </button>

      <div id="keyStatus"></div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   D.A.B.S.y
   ONE FILE VERSION
===================================================== */

const app =
document.getElementById("app");

const face =
document.getElementById("face");

const glow =
document.getElementById("glow");

const status =
document.getElementById("status");

const message =
document.getElementById("message");

const menu =
document.getElementById("menu");

const study =
document.getElementById("study");

const settings =
document.getElementById("settings");

const settingsScreen =
document.getElementById("settingsScreen");

const closeButton =
document.getElementById("close");

const apiKeyInput =
document.getElementById("apiKey");

const connect =
document.getElementById("connect");

const keyStatus =
document.getElementById("keyStatus");


/* =====================================================
   STATE
===================================================== */

let apiKey =
localStorage.getItem("dabsy_api_key") || "";

let studyMode =
localStorage.getItem("dabsy_study") === "true";

let listening = false;

let menuOpen = false;

let tapTimer = null;

let rubbing = false;

let touchStart = null;

let recognition = null;

let lastX = null;
let lastY = null;
let lastZ = null;

let lastShake = 0;


/* =====================================================
   BASIC UI
===================================================== */

function setMessage(s,m){

  status.textContent=s;
  message.textContent=m;

}


function updateStudy(){

  document.body.classList.toggle(
    "studyMode",
    studyMode
  );

}


updateStudy();


/* =====================================================
   BLINK
===================================================== */

function blink(){

  face.classList.add("blink");

  setTimeout(()=>{
    face.classList.remove("blink");
  },160);

}


setInterval(()=>{

  if(
    !listening &&
    !face.classList.contains("dizzy") &&
    !app.classList.contains("thinking")
  ){
    blink();
  }

},3500);


/* =====================================================
   RANDOM EYE MOVEMENT
===================================================== */

setInterval(()=>{

  if(listening) return;

  const cls =
    Math.random()>.5
    ? "lookLeft"
    : "lookRight";

  face.classList.add(cls);

  setTimeout(()=>{
    face.classList.remove(cls);
  },800);

},6000);


/* =====================================================
   MENU
===================================================== */

function toggleMenu(){

  menuOpen=!menuOpen;

  app.classList.toggle(
    "menuOpen",
    menuOpen
  );

}


function closeMenu(){

  menuOpen=false;

  app.classList.remove(
    "menuOpen"
  );

}


/* =====================================================
   DOUBLE TAP
===================================================== */

let lastTap=0;

app.addEventListener(
  "pointerup",
  e=>{

    if(
      e.target.closest(".bubble") ||
      e.target.closest(".card")
    ) return;

    const now=Date.now();

    if(now-lastTap<350){

      clearTimeout(tapTimer);

      toggleMenu();

    }

    lastTap=now;

  }
);


/* =====================================================
   SINGLE TAP
===================================================== */

app.addEventListener(
  "pointerdown",
  e=>{

    if(
      e.target.closest(".bubble") ||
      e.target.closest(".card")
    ) return;

    touchStart={
      x:e.clientX,
      y:e.clientY
    };

    rubbing=false;

    clearTimeout(tapTimer);

    tapTimer=setTimeout(()=>{

      if(!rubbing){

        activateMicrophone();

      }

    },350);

  }
);


/* =====================================================
   RUBBING
===================================================== */

app.addEventListener(
  "pointermove",
  e=>{

    if(!touchStart) return;

    const dx=
      e.clientX-touchStart.x;

    const dy=
      e.clientY-touchStart.y;

    if(
      Math.sqrt(dx*dx+dy*dy)>12
    ){

      rubbing=true;

      clearTimeout(tapTimer);

      if(navigator.vibrate){

        navigator.vibrate(7);

      }

    }

  }
);


app.addEventListener(
  "pointerup",
  ()=>{

    clearTimeout(tapTimer);

    touchStart=null;

    rubbing=false;

  }
);


/* =====================================================
   STUDY MODE
===================================================== */

study.addEventListener(
  "click",
  e=>{

    e.stopPropagation();

    studyMode=!studyMode;

    localStorage.setItem(
      "dabsy_study",
      studyMode
    );

    updateStudy();

    closeMenu();

    if(studyMode){

      setMessage(
        "Study Mode",
        "Okay. Let's study."
      );

      speak(
        "Study mode activated. Let's study."
      );

    }else{

      setMessage(
        "Normal Mode",
        "Back to normal."
      );

    }

  }
);


/* =====================================================
   SETTINGS
===================================================== */

settings.addEventListener(
  "click",
  e=>{

    e.stopPropagation();

    closeMenu();

    settingsScreen.classList.add("open");

    apiKeyInput.value=apiKey;

    keyStatus.textContent=
      apiKey
      ? "A Gemini key is saved on this device."
      : "No Gemini key connected.";

  }
);


closeButton.addEventListener(
  "click",
  ()=>{

    settingsScreen.classList.remove(
      "open"
    );

  }
);


settingsScreen.addEventListener(
  "click",
  e=>{

    if(e.target===settingsScreen){

      settingsScreen.classList.remove(
        "open"
      );

    }

  }
);


/* =====================================================
   SAVE API KEY
===================================================== */

connect.addEventListener(
  "click",
  ()=>{

    const value=
      apiKeyInput.value.trim();

    if(!value){

      keyStatus.textContent=
        "Paste your Gemini API key first.";

      return;

    }

    apiKey=value;

    localStorage.setItem(
      "dabsy_api_key",
      apiKey
    );

    keyStatus.textContent=
      "Gemini key saved ✓";

    setTimeout(()=>{

      settingsScreen.classList.remove(
        "open"
      );

      setMessage(
        "Gemini Ready",
        "My brain is online."
      );

    },600);

  }
);


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  recognition=
    new SpeechRecognition();

  recognition.lang="en-IN";

  recognition.continuous=false;

  recognition.interimResults=false;


  recognition.onstart=()=>{

    listening=true;

    face.classList.add(
      "listening"
    );

    setMessage(
      "Listening",
      "I'm listening..."
    );

  };


  recognition.onresult=
    event=>{

      const text=
        event
        .results[0][0]
        .transcript
        .trim();

      if(text){

        askGemini(text);

      }

    };


  recognition.onerror=
    event=>{

      listening=false;

      face.classList.remove(
        "listening"
      );

      if(
        event.error==="not-allowed"
      ){

        setMessage(
          "Microphone",
          "Please allow microphone permission."
        );

      }else{

        setMessage(
          "Didn't hear you",
          "Tap me and try again."
        );

      }

    };


  recognition.onend=()=>{

    listening=false;

    face.classList.remove(
      "listening"
    );

  };

}


/* =====================================================
   MICROPHONE
===================================================== */

function activateMicrophone(){

  closeMenu();

  if(!recognition){

    setMessage(
      "Microphone",
      "Speech recognition isn't supported here."
    );

    return;

  }


  if(!apiKey){

    setMessage(
      "Gemini Offline",
      "Double tap me and connect Gemini."
    );

    return;

  }


  try{

    recognition.start();

  }catch(e){

    console.log(e);

  }

}


/* =====================================================
   GEMINI
===================================================== */

async function askGemini(userText){

  app.classList.add(
    "thinking"
  );

  setMessage(
    "Thinking",
    "Give me a second..."
  );


  const systemPrompt=`

You are D.A.B.S.y.

You are a friendly AI desk companion
and Class 11 study buddy.

You should sound natural,
friendly and concise.

Never say:
"As an AI language model".

The user is a student.

If Study Mode is active:
- explain step by step
- use simple language
- show reasoning clearly
- give examples when useful
- help the student learn instead of only dumping answers

Current mode:
${studyMode ? "STUDY MODE" : "NORMAL MODE"}

User said:
${userText}

Answer naturally.
`;


  try{

    const response=
      await fetch(

        "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent",

        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "x-goog-api-key":
              apiKey
          },

          body:JSON.stringify({

            systemInstruction:{
              parts:[
                {
                  text:
                    systemPrompt
                }
              ]
            },

            contents:[
              {
                role:"user",

                parts:[
                  {
                    text:userText
                  }
                ]
              }
            ]

          })

        }

      );


    const data=
      await response.json();


    console.log(
      "Gemini:",
      data
    );


    if(!response.ok){

      throw new Error(
        data?.error?.message ||
        `Gemini error ${response.status}`
      );

    }


    const answer=
      data
      ?.candidates?.[0]
      ?.content
      ?.parts
      ?.map(p=>p.text||"")
      ?.join("")
      ?.trim();


    if(!answer){

      throw new Error(
        "Gemini returned no answer."
      );

    }


    app.classList.remove(
      "thinking"
    );

    app.classList.add(
      "speaking"
    );


    setMessage(
      studyMode
      ? "Study Mode"
      : "DABSy",
      answer
    );


    speak(answer);


    setTimeout(()=>{

      app.classList.remove(
        "speaking"
      );

    },1000);


  }catch(error){

    console.error(
      "REAL GEMINI ERROR:",
      error
    );

    app.classList.remove(
      "thinking"
    );

    document.body.classList.add(
      "error"
    );


    setMessage(
      "Gemini Error",
      error.message
    );


    setTimeout(()=>{

      document.body.classList.remove(
        "error"
      );

    },4000);

  }

}


/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speak(text){

  if(
    !("speechSynthesis" in window)
  ) return;


  speechSynthesis.cancel();


  const clean=
    String(text)
    .replace(/[*_#`]/g,"");


  const voice=
    new SpeechSynthesisUtterance(
      clean
    );


  voice.rate=1.02;

  voice.pitch=1;


  voice.onstart=()=>{

    app.classList.add(
      "speaking"
    );

  };


  voice.onend=()=>{

    app.classList.remove(
      "speaking"
    );

  };


  speechSynthesis.speak(
    voice
  );

}


/* =====================================================
   SHAKE DETECTION
===================================================== */

if(
  "DeviceMotionEvent"
  in window
){

  window.addEven
