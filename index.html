<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>D.A.B.S.y</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Full-screen DABSy Face Interface -->
    <main id="dabsy-container" role="main" aria-label="DABSy Interface">
        <div id="face-surface">
            <div id="eyes-container">
                <div class="eye left-eye">
                    <div class="pupil"></div>
                </div>
                <div class="eye right-eye">
                    <div class="pupil"></div>
                </div>
            </div>
            <div id="status-indicator" aria-live="polite">Tap to speak</div>
        </div>
    </main>

    <!-- Floating Glass Bubbles Menu (Double Tap) -->
    <nav id="glass-menu" class="hidden" aria-label="Quick Menu">
        <button id="bubble-study" class="glass-bubble">
            <span class="bubble-icon">📚</span>
            <span class="bubble-text">Study Mode: <b id="study-status">Off</b></span>
        </button>
        <button id="bubble-settings" class="glass-bubble">
            <span class="bubble-icon">⚙️</span>
            <span class="bubble-text">Settings</span>
        </button>
    </nav>

    <!-- Settings Modal / Overlay -->
    <div id="settings-overlay" class="hidden" aria-hidden="true">
        <div class="settings-card">
            <h2>DABSy Settings</h2>
            <div class="form-group">
                <label for="api-key-input">Gemini API Key:</label>
                <input type="password" id="api-key-input" placeholder="Enter your Gemini API key">
                <small>Stored securely in your browser's local storage.</small>
            </div>
            <div class="form-group voice-select-group">
                <label for="voice-select">Voice Output:</label>
                <select id="voice-select"></select>
            </div>
            <div class="settings-actions">
                <button id="save-settings" class="action-btn">Save & Close</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
