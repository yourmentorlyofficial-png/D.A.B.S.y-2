<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">
  <meta name="description" content="DABSy, your AI desk and study companion.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">

  <link rel="stylesheet" href="./styles.css">

  <title>DABSy</title>
</head>

<body>

  <main id="app">

    <section id="face" aria-label="DABSy AI companion">

      <div id="ambientGlow"></div>

      <div id="eyes">

        <div class="eye" id="leftEye">
          <div class="pupil"></div>
          <div class="eyeGlow"></div>
        </div>

        <div class="eye" id="rightEye">
          <div class="pupil"></div>
          <div class="eyeGlow"></div>
        </div>

      </div>

      <div id="speechArea">
        <div id="status">DABSy</div>
        <div id="speech">Hello. I'm here.</div>
      </div>

      <div id="hint">
        tap to talk • double-tap for DABSy
      </div>

      <div id="heart">♥</div>

      <div id="touchRipple"></div>

    </section>


    <!-- FLOATING BUBBLE MENU -->

    <div id="bubbleMenu">

      <button class="bubble" id="studyButton">
        <span>📚</span>
        <small>Study</small>
      </button>

      <button class="bubble" id="settingsButton">
        <span>⚙</span>
        <small>Settings</small>
      </button>

      <button class="bubble" id="installButton">
        <span>↓</span>
        <small>Install</small>
      </button>

      <button class="bubble closeBubble" id="closeMenuButton">
        <span>×</span>
      </button>

    </div>


    <!-- SETTINGS -->

    <div class="overlay" id="settingsOverlay">

      <div class="glassSheet">

        <div class="sheetHeader">
          <h2>DABSy</h2>
          <button id="closeSettings">×</button>
        </div>

        <p class="sheetDescription">
          DABSy uses a private AI backend.
          Your Gemini API key is never stored inside this app.
        </p>

        <div class="infoCard">

          <span>🔐</span>

          <div>
            <strong>Private AI connection</strong>
            <small>
              Gemini credentials stay on the secure backend.
            </small>
          </div>

        </div>

        <button class="primaryButton" id="testConnection">
          Test AI connection
        </button>

        <div class="settingStatus" id="settingStatus"></div>

      </div>

    </div>


    <!-- STUDY MODE -->

    <div class="overlay" id="studyOverlay">

      <div class="glassSheet">

        <div class="sheetHeader">
          <h2>Study Mode</h2>
          <button id="closeStudy">×</button>
        </div>

        <p class="sheetDescription">
          DABSy becomes a calm, step-by-step tutor.
        </p>

        <div class="studyOptions">

          <button class="studyOption" data-topic="Physics">
            <span>⚛️</span>
            <strong>Physics</strong>
          </button>

          <button class="studyOption" data-topic="Chemistry">
            <span>🧪</span>
            <strong>Chemistry</strong>
          </button>

          <button class="studyOption" data-topic="Mathematics">
            <span>📐</span>
            <strong>Maths</strong>
          </button>

          <button class="studyOption" data-topic="Biology">
            <span>🧬</span>
            <strong>Biology</strong>
          </button>

        </div>

        <button class="primaryButton" id="studyTalkButton">
          🎙️ Talk to DABSy
        </button>

      </div>

    </div>


    <!-- ANSWER PANEL -->

    <div id="answerPanel">

      <div id="answerHeader">

        <span id="answerTitle">DABSy</span>

        <button id="closeAnswer">×</button>

      </div>

      <div id="answerContent"></div>

    </div>

  </main>


  <script src="./app.js" defer></script>

</body>
</html>
