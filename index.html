<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#020308">
  <meta name="description" content="D.A.B.S.y - AI Desk Study Buddy">

  <title>D.A.B.S.y • AI Desk Buddy</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
</head>

<body>

  <!-- Ambient background -->
  <div class="ambient-aura" id="ambientAura"></div>

  <!-- =========================
       MAIN DABSY STAGE
  ========================== -->

  <main class="stage">

    <!-- DABSy's face -->
    <section class="dabsy" id="dabsy">

      <div class="eyes">

        <div class="eye-wrap">
          <div class="eye" id="leftEye"></div>
        </div>

        <div class="eye-wrap">
          <div class="eye" id="rightEye"></div>
        </div>

      </div>

      <div class="mouth" id="mouth"></div>

    </section>


    <!-- =========================
         DIALOGUE
    ========================== -->

    <section class="dialogue">

      <div class="status" id="status">
        DABSy Online
      </div>

      <div class="speech" id="speech">
        Hello Swagat. How can I help you today?
      </div>

    </section>


    <!-- =========================
         PRESENTATION PANEL
    ========================== -->

    <section
      class="presentation-panel"
      id="presentationPanel"
    >

      <header class="panel-header">

        <div id="panelTitle">
          DABSy
        </div>

        <button
          id="closePanel"
          class="close-btn"
          aria-label="Close"
        >
          ×
        </button>

      </header>

      <div
        id="panelContent"
        class="panel-content"
      ></div>

    </section>


    <!-- =========================
         CONTROLS
    ========================== -->

    <nav class="controls">

      <button
        id="talkButton"
        class="talk-button"
      >

        <span id="micIcon">🎙</span>

        <span id="talkText">
          Talk to DABSy
        </span>

      </button>


      <button
        id="studyButton"
        class="small-button"
        title="Study Mode"
      >
        📚
      </button>


      <button
        id="settingsButton"
        class="small-button"
        title="Gemini Settings"
      >
        ⚙
      </button>

    </nav>


    <!-- =========================
         MODE INDICATOR
    ========================== -->

    <div
      class="mode-indicator"
      id="modeIndicator"
    >
      Normal Mode
    </div>

  </main>


  <!-- =========================
       SCRIPT
  ========================== -->

  <script
    type="module"
    src="./app.js"
  ></script>

</body>
</html>
