<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#000000">
<meta name="description" content="D.A.B.S.y AI Desk Study Buddy">

<link rel="manifest" href="./manifest.json">

<title>D.A.B.S.y</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    touch-action:none;
}

#dabsyWorld{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:#000;
}

/* =========================================
   SUBTLE FACE GLOW
========================================= */

#faceGlow{
    position:absolute;
    left:50%;
    top:50%;

    width:80vw;
    height:60vh;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            rgba(0,220,255,.11),
            transparent 70%
        );

    filter:blur(60px);

    pointer-events:none;

    transition:.5s;
}

/* =========================================
   FACE
========================================= */

#dabsyFace{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    transition:
        transform .25s ease;

    pointer-events:none;
}

#eyes{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:clamp(
        60px,
        13vw,
        135px
    );
}

.eye{
    position:relative;

    width:clamp(
        110px,
        24vw,
        245px
    );

    height:clamp(
        170px,
        38vw,
        390px
    );

    border-radius:42%;

    background:#08e4f5;

    box-shadow:
        0 0 20px rgba(0,240,255,.9),
        0 0 55px rgba(0,220,255,.6),
        0 0 120px rgba(0,200,255,.3);

    overflow:hidden;

    animation:
        eyeBreath 4s ease-in-out infinite;

    transition:.25s;
}

.eye:nth-child(2){
    animation-delay:-1.7s;
}

.eyeHighlight{
    position:absolute;

    left:18%;
    top:12%;

    width:25%;
    height:20%;

    border-radius:50%;

    background:#fff;

    opacity:.9;
}

@keyframes eyeBreath{

    0%,100%{
        transform:scaleY(1);
    }

    50%{
        transform:scaleY(.97);
    }

}

/* =========================================
   BLINK
========================================= */

.blink .eye{

    height:10px;

    border-radius:50%;

}

/* =========================================
   EYE LOOK
========================================= */

.lookLeft .eye{
    transform:translateX(-18px);
}

.lookRight .eye{
    transform:translateX(18px);
}

/* =========================================
   LISTENING
========================================= */

.listening .eye{

    transform:scale(1.04);

    box-shadow:
        0 0 25px #fff,
        0 0 70px rgba(0,240,255,.8),
        0 0 150px rgba(0,220,255,.45);

}

/* =========================================
   THINKING
========================================= */

.thinking .eye{

    animation:
        thinkingEyes .7s ease-in-out
        infinite alternate;

}

@keyframes thinkingEyes{

    from{
        transform:translateY(-8px)
                   scaleY(.96);
    }

    to{
        transform:translateY(8px)
                   scaleY(1);
    }

}

/* =========================================
   SPEAKING
========================================= */

.speaking .eye{

    animation:
        speakingEyes .4s ease-in-out
        infinite alternate;

}

@keyframes speakingEyes{

    from{
        transform:scaleY(.98);
    }

    to{
        transform:scaleY(1.03);
    }

}

/* =========================================
   MOUTH
========================================= */

#mouth{

    width:65px;
    height:30px;

    margin-top:25px;

    border-bottom:
        5px solid #08e4f5;

    border-radius:
        0 0 70px 70px;

    filter:
        drop-shadow(
            0 0 8px #08e4f5
        );

}

.speaking #mouth{

    width:48px;
    height:35px;

    border:
        4px solid #08e4f5;

    border-radius:50%;

    animation:
        mouthTalk .16s
        infinite alternate;

}

@keyframes mouthTalk{

    from{
        transform:scaleY(.5);
    }

    to{
        transform:scaleY(1);
    }

}

/* =========================================
   SPEECH
========================================= */

#dialogue{

    position:absolute;

    left:50%;
    top:calc(50% + 220px);

    transform:translateX(-50%);

    width:88%;

    text-align:center;

    pointer-events:none;
}

#status{

    font-size:12px;

    letter-spacing:.25em;

    text-transform:uppercase;

    color:
        rgba(255,255,255,.5);

    margin-bottom:12px;

}

#speech{

    font-size:
        clamp(
            15px,
            4vw,
            22px
        );

    line-height:1.45;

    color:
        rgba(255,255,255,.92);

}

/* =========================================
   BUBBLE MENU
========================================= */

#bubbleMenu{

    position:absolute;

    left:50%;
    top:50%;

    width:0;
    height:0;

}

.bubble{

    position:absolute;

    width:74px;
    height:74px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(15,15,18,.84);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    color:#fff;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:3px;

    opacity:0;

    transform:scale(.2);

    pointer-events:none;

    transition:
        opacity .25s,
        transform .35s
        cubic-bezier(.2,.9,.2,1);

}

.bubble span{
    font-size:23px;
}

.bubble small{

    font-size:9px;

    color:
        rgba(255,255,255,.6);

}

#studyBubble{

    left:-120px;
    top:-55px;

}

#settingsBubble{

    left:46px;
    top:-55px;

}

.menuOpen .bubble{

    opacity:1;

    transform:scale(1);

    pointer-events:auto;

}

/* =========================================
   STUDY BADGE
========================================= */

#studyBadge{

    position:absolute;

    top:
        max(
            20px,
            env(safe-area-inset-top)
        );

    left:50%;

    transform:
        translateX(-50%)
        translateY(-20px);

    padding:
        9px 16px;

    border-radius:999px;

    background:
        rgba(20,20,20,.75);

    border:
        1px solid
        rgba(0,230,255,.2);

    color:
        rgba(255,255,255,.7);

    font-size:11px;

    letter-spacing:.12em;

    opacity:0;

    transition:.3s;

}

.studyMode #studyBadge{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);

}

/* =========================================
   SETTINGS
========================================= */

#settingsPanel{

    position:fixed;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:25px;

    background:
        rgba(0,0,0,.76);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:100;

}

#settingsPanel.open{

    opacity:1;

    pointer-events:auto;

}

.settingsCard{

    position:relative;

    width:min(
        90vw,
        430px
    );

    padding:28px;

    border-radius:28px;

    background:
        rgba(18,18,20,.92);

    border:
        1px solid
        rgba(255,255,255,.1);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.7);

}

.settingsTitle{

    font-size:25px;

    font-weight:700;

}

.settingsSubtitle{

    margin-top:4px;

    margin-bottom:28px;

    color:
        rgba(255,255,255,.45);

}

.settingsCard label{

    display:block;

    margin-bottom:8px;

    font-size:12px;

    color:
        rgba(255,255,255,.6);

}

#apiKeyInput{

    width:100%;

    height:48px;

    border-radius:14px;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.05);

    color:#fff;

    padding:
        0 14px;

    outline:none;

    font-size:14px;

    user-select:text;

}

#apiKeyInput:focus{

    border-color:#08e4f5;

}

#saveKey{

    width:100%;

    height:48px;

    margin-top:12px;

    border:0;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #7864ff,
            #00dff5
        );

    color:#fff;

    font-weight:700;

}

#closeSettings{

    position:absolute;

    right:18px;
    top:18px;

    width:38px;
    height:38px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.05);

    color:#fff;

    font-size:22px;

}

#keyStatus{

    margin-top:12px;

    font-size:11px;

    color:
        rgba(255,255,255,.5);

}

/* =========================================
   SHAKE
========================================= */

.dizzy{

    animation:
        dizzy .12s
        linear infinite;

}

@keyframes dizzy{

    0%{
        transform:
            translate(-3px,-3px)
            rotate(-3deg);
    }

    25%{
        transform:
            translate(3px,-2px)
            rotate(3deg);
    }

    50%{
        transform:
            translate(-3px,3px)
            rotate(-3deg);
    }

    75%{
        transform:
            translate(3px,2px)
            rotate(3deg);
    }

    100%{
        transform:
            translate(0,0)
            rotate(0);
    }

}

/* =========================================
   ERROR
========================================= */

.error .eye{

    background:#ff4165;

    box-shadow:
        0 0 20px
        rgba(255,50,80,.9),

        0 0 70px
        rgba(255,30,70,.5);

}

/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    #eyes{

        gap:70px;

    }

    .eye{

        width:110px;

        height:175px;

    }

    #dialogue{

        top:
            calc(
                50% + 185px
            );

    }

}

</style>
</head>


<body>

<div id="dabsyWorld">

    <div id="faceGlow"></div>


    <!-- =========================
         DABSy FACE
    ========================== -->

    <section id="dabsyFace">

        <div id="eyes">

            <div class="eye">

                <div class="eyeHighlight"></div>

            </div>


            <div class="eye">

                <div class="eyeHighlight"></div>

            </div>

        </div>


        <div id="mouth"></div>

    </section>


    <!-- =========================
         TEXT
    ========================== -->

    <section id="dialogue">

        <div id="status">
            DABSy
        </div>

        <div id="speech">
            Hello Swagat. Tap me.
        </div>

    </section>


    <!-- =========================
         DOUBLE TAP MENU
    ========================== -->

    <div id="bubbleMenu">

        <button
            id="studyBubble"
            class="bubble">

            <span>📚</span>

            <small>
                Study
            </small>

        </button>


        <button
            id="settingsBubble"
            class="bubble">

            <span>⚙️</span>

            <small>
                Settings
            </small>

        </button>

    </div>


    <!-- =========================
         STUDY MODE
    ========================== -->

    <div id="studyBadge">

        📚 STUDY MODE

    </div>


    <!-- =========================
         SETTINGS
    ========================== -->

    <div id="settingsPanel">

        <div class="settingsCard">

            <button id="closeSettings">
                ×
            </button>


            <div class="settingsTitle">
                D.A.B.S.y
            </div>


            <div class="settingsSubtitle">
                Gemini brain
            </div>


            <label>
                Gemini API key
            </label>


            <input
                id="apiKeyInput"
                type="password"
                placeholder="Paste your Gemini API key"
                autocomplete="off"
            >


            <button id="saveKey">
                Connect Gemini
            </button>


            <div id="keyStatus"></div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   D.A.B.S.y CORE
===================================================== */

const world =
    document.getElementById(
        "dabsyWorld"
    );

const face =
    document.getElementById(
        "dabsyFace"
    );

const glow =
    document.getElementById(
        "faceGlow"
    );

const status =
    document.getElementById(
        "status"
    );

const speech =
    document.getElementById(
        "speech"
    );

const bubbleMenu =
    document.getElementById(
        "bubbleMenu"
    );

const studyBubble =
    document.getElementById(
        "studyBubble"
    );

const settingsBubble =
    document.getElementById(
        "settingsBubble"
    );

const settingsPanel =
    document.getElementById(
        "settingsPanel"
    );

const closeSettings =
    document.getElementById(
        "closeSettings"
    );

const apiKeyInput =
    document.getElementById(
        "apiKeyInput"
    );

const saveKey =
    document.getElementById(
        "saveKey"
    );

const keyStatus =
    document.getElementById(
        "keyStatus"
    );


/* =====================================================
   STATE
===================================================== */

let apiKey =
    localStorage.getItem(
        "dabsy_api_key"
    ) || "";


let studyMode =
    localStorage.getItem(
        "dabsy_study"
    ) === "true";


let listening=false;

let menuOpen=false;

let rubbing=false;

let touchStart=null;

let tapTimer=null;

let lastTap=0;

let recognition=null;

let lastX=null;
let lastY=null;
let lastZ=null;

let lastShake=0;


/* =====================================================
   MESSAGE
===================================================== */

function setMessage(
    state,
    text
){

    status.textContent =
        state;

    speech.textContent =
        text;

}


/* =====================================================
   STUDY MODE
===================================================== */

function updateStudyMode(){

    document.body.classList.toggle(
        "studyMode",
        studyMode
    );

}


updateStudyMode();


/* =====================================================
   BLINK
===================================================== */

function blink(){

    face.classList.add(
        "blink"
    );

    setTimeout(()=>{

        face.classList.remove(
            "blink"
        );

    },160);

}


setInterval(()=>{

    if(
        !listening &&
        !world.classList.contains(
            "thinking"
        ) &&
        !face.classList.contains(
            "dizzy"
        )
    ){

        blink();

    }

},3500);


/* =====================================================
   EYE PERSONALITY
===================================================== */

setInterval(()=>{

    if(listening) return;

    const direction =
        Math.random() > .5
        ? "lookLeft"
        : "lookRight";

    face.classList.add(
        direction
    );

    setTimeout(()=>{

        face.classList.remove(
            direction
        );

    },800);

},6000);


/* =====================================================
   DOUBLE TAP
===================================================== */

document.addEventListener(
    "pointerup",
    event=>{

        if(
            event.target.closest(
                ".bubble"
            ) ||
            event.target.closest(
                ".settingsCard"
            )
        ){

            return;

        }

        const now =
            Date.now();

        if(
            now-lastTap < 350
        ){

            clearTimeout(
                tapTimer
            );

            toggleMenu();

        }

        lastTap=now;

    }
);


/* =====================================================
   SINGLE TAP
===================================================== */

world.addEventListener(
    "pointerdown",
    event=>{

        if(
            event.target.closest(
                ".bubble"
            ) ||
            event.target.closest(
                ".settingsCard"
            )
        ){

            return;

        }

        touchStart={
            x:event.clientX,
            y:event.clientY
        };

        rubbing=false;

        clearTimeout(
            tapTimer
        );

        tapTimer=setTimeout(()=>{

            if(!rubbing){

                activateMicrophone();

            }

        },350);

    }
);


/* =====================================================
   RUBBING
===================================================== */

world.addEventListener(
    "pointermove",
    event=>{

        if(!touchStart) return;

        const dx =
            event.clientX -
            touchStart.x;

        const dy =
            event.clientY -
            touchStart.y;

        if(
            Math.sqrt(
                dx*dx + dy*dy
            ) > 12
        ){

            rubbing=true;

            clearTimeout(
                tapTimer
            );

            if(
                navigator.vibrate
            ){

                navigator.vibrate(
                    7
                );

            }

        }

    }
);


world.addEventListener(
    "pointerup",
    ()=>{

        clearTimeout(
            tapTimer
        );

        touchStart=null;

        rubbing=false;

    }
);


/* =====================================================
   MENU
===================================================== */

function toggleMenu(){

    menuOpen =
        !menuOpen;

    world.classList.toggle(
        "menuOpen",
        menuOpen
    );

}


function closeMenu(){

    menuOpen=false;

    world.classList.remove(
        "menuOpen"
    );

}


/* =====================================================
   STUDY
===================================================== */

studyBubble.addEventListener(
    "click",
    event=>{

        event.stopPropagation();

        studyMode =
            !studyMode;

        localStorage.setItem(
            "dabsy_study",
            studyMode
        );

        updateStudyMode();

        closeMenu();

        if(studyMode){

            setMessage(
                "Study Mode",
                "Okay. Let's study."
            );

            speak(
                "Study mode activated. Let's study."
            );

        }else{

            setMessage(
                "Normal Mode",
                "Back to normal."
            );

        }

    }
);


/* =====================================================
   SETTINGS
===================================================== */

settingsBubble.addEventListener(
    "click",
    event=>{

        event.stopPropagation();

        closeMenu();

        apiKeyInput.value =
            apiKey;

        keyStatus.textContent =
            apiKey
            ? "A Gemini key is saved on this device."
            : "No Gemini key connected.";

        settingsPanel.classList.add(
            "open"
        );

    }
);


closeSettings.addEventListener(
    "click",
    ()=>{

        settingsPanel.classList.remove(
            "open"
        );

    }
);


settingsPanel.addEventListener(
    "click",
    event=>{

        if(
            event.target ===
            settingsPanel
        ){

            settingsPanel.classList.remove(
                "open"
            );

        }

    }
);


/* =====================================================
   SAVE GEMINI KEY
===================================================== */

saveKey.addEventListener(
    "click",
    ()=>{

        const value =
            apiKeyInput.value.trim();

        if(!value){

            keyStatus.textContent =
                "Paste your Gemini API key first.";

            return;

        }

        apiKey=value;

        localStorage.setItem(
            "dabsy_api_key",
            apiKey
        );

        keyStatus.textContent =
            "Gemini key saved ✓";

        setTimeout(()=>{

            settingsPanel.classList.remove(
                "open"
            );

            setMessage(
                "Gemini Ready",
                "My brain is online."
            );

        },600);

    }
);


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-IN";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart=()=>{

        listening=true;

        face.classList.add(
            "listening"
        );

        setMessage(
            "Listening",
            "I'm listening..."
        );

    };


    recognition.onresult =
        event=>{

            const text =
                event
                .results[0][0]
                .transcript
                .trim();

            if(text){

                askGemini(
                    text
                );

            }

        };


    recognition.onerror =
        event=>{

            listening=false;

            face.classList.remove(
                "listening"
            );

            if(
                event.error ===
                "not-allowed"
            ){

                setMessage(
                    "Microphone",
                    "Please allow microphone permission."
                );

            }else{

                setMessage(
                    "Didn't hear you",
                    "Tap me and try again."
                );

            }

        };


    recognition.onend=()=>{

        listening=false;

        face.classList.remove(
            "listening"
        );

    };

}


/* =====================================================
   MICROPHONE
===================================================== */

function activateMicrophone(){

    closeMenu();

    if(!recognition){

        setMessage(
            "Microphone",
            "Speech recognition isn't supported here."
        );

        return;

    }


    if(!apiKey){

        setMessage(
            "Gemini Offline",
            "Double tap me and connect Gemini."
        );

        return;

    }


    try{

        recognition.start();

    }catch(error){

        console.log(
            error
        );

    }

}


/* =====================================================
   GEMINI
===================================================== */

async function askGemini(
    userText
){

    world.classList.add(
        "thinking"
    );

    setMessage(
        "Thinking",
        "Give me a second..."
    );


    const prompt = `

You are D.A.B.S.y.

You are a friendly AI desk companion
and Class 11 study buddy.

Be natural, friendly and concise.

Never begin with:
"As an AI language model".

The user is a student.

If Study Mode is active:

- explain step by step
- use simple language
- show the reasoning clearly
- give examples when useful
- help the student understand

Current mode:
${
    studyMode
    ? "STUDY MODE"
    : "NORMAL MODE"
}

User said:

${userText}

Answer naturally.

`;


    try{

        const response =
            await fetch(

                "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent",

                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "application/json",

                        "x-goog-api-key":
                            apiKey

                    },

                    body:
                        JSON.stringify({

                            systemInstruction:{

                                parts:[

                                    {
                                        text:
                                            prompt
                                    }

                                ]

                            },

                            contents:[

                                {

                                    role:
                                        "user",

                                    parts:[

                                        {
                                            text:
                                                userText
                                        }

                                    ]

                                }

                            ]

                        })

                }

            );


        const data =
            await response.json();


        console.log(
            "Gemini response:",
            data
        );


        if(
            !response.ok
        ){

            throw new Error(
                data?.error?.message ||
                "Gemini request failed."
            );

        }


        const answer =
            data
            ?.candidates?.[0]
            ?.content?.parts
            ?.map(
                part =>
                    part.text || ""
            )
            ?.join("")
            ?.trim();


        if(!answer){

            throw new Error(
                "Gemini returned no answer."
            );

        }


        world.classList.remove(
            "thinking"
        );

        world.classList.add(
            "speaking"
        );


        setMessage(
            studyMode
            ? "Study Mode"
            : "DABSy",
            answer
        );


        speak(
            answer
        );


    }catch(error){

        console.error(
            "GEMINI ERROR:",
            error
        );

        world.classList.remove(
            "thinking"
        );

        document.body.classList.add(
            "error"
        );

        setMessage(
            "Gemini Error",
            error.message ||
            "Gemini couldn't respond."
        );


        setTimeout(()=>{

            document.body.classList.remove(
                "error"
            );

        },4000);

    }

}


/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speak(
    text
){

    if(
        !("speechSynthesis"
        in window)
    ){

        return;

    }


    speechSynthesis.cancel();


    const clean =
        String(text)
        .replace(
            /[*_#`]/g,
            ""
        );


    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );


    utterance.rate =
        1.02;

    utterance.pitch =
        1.0;


    utterance.onstart=()=>{

        world.classList.add(
            "speaking"
        );

    };


    utterance.onend=()=>{

        world.classList.remove(
            "speaking"
        );

    };


    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   SHAKE
===================================================== */

if(
    "DeviceMotionEvent"
    in window
){

    window.addEventListener(
        "devicemotion",
        event=>{

            const a =
                event
                .accelerationIncludingGravity;

            if(!a) return;


            const x =
                a.x || 0;

            const y =
                a.y || 0;

            const z =
                a.z || 0;


            if(
                lastX === null
            ){

                lastX=x;
                lastY=y;
                lastZ=z;

                return;

            }


            const movement =
                Math.abs(
                    x-lastX
                ) +
                Math.abs(
                    y-lastY
                ) +
                Math.abs(
                    z-lastZ
                );


            lastX=x;
            lastY=y;
            lastZ=z;


            const now =
                Date.now();


            if(
                movement > 24 &&
                now-lastShake > 900
            ){

                lastShake=now;

                dizzy();

            }

        },
        {
            passive:true
        }
    );

}


function dizzy(){

    if(
        settingsPanel.classList.contains(
            "open"
        )
    ){

        return;

    }


    closeMenu();


    face.classList.add(
        "dizzy"
    );


    glow.style.transform =
        "translate(-50%,-50%) scale(1.3)";


    setMessage(
        "🫨",
        "Woooah..."
    );


    if(
        navigator.vibrate
    ){

        navigator.vibrate(
            [
                40,
                30,
                40,
                30,
                60
            ]
        );

    }


    setTimeout(()=>{

        face.classList.remove(
            "dizzy"
        );

        glow.style.transform =
            "translate(-50%,-50%)";


        setMessage(
            "DABSy",
            "Okay... I'm good."
        );

    },1300);

}
